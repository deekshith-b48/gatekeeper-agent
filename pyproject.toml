[project]
name = "gatekeeper"
version = "0.2.0"
description = "Voice agent backend that screens callers and books meetings on a real calendar."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "websockets>=12",
  "sqlmodel>=0.0.22", "pydantic>=2.7", "pydantic-settings>=2.3",
  "apscheduler>=3.10,<4", "httpx>=0.27", "numpy>=1.26", "pyyaml>=6",
  "google-api-python-client>=2.100", "google-auth-oauthlib>=1.2",
  "caldav>=1.3,<3", "icalendar>=5",
]

[project.optional-dependencies]
# Heavy, needed only for the voice path (installed in the Docker image)
voice = ["faster-whisper>=1.0", "silero-vad>=5.1", "piper-tts>=1.3"]
cli = ["sounddevice>=0.4", "websockets>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
