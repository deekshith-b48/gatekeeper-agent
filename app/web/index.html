<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa855">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gatekeeper">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/ui.css">
<title>Gatekeeper</title>
<style>
  body { display:flex; flex-direction:column; height:100dvh; }
  .top { display:flex; align-items:center; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 14px 10px; background:var(--wa); color:#fff; }
  .top .avatar { background:#fff; color:var(--wa); } .who { flex:1; min-width:0; } .who b { display:block; font-size:16px; } .who small { opacity:.92; display:flex; align-items:center; gap:6px; }
  .top .ibtn { background:rgba(255,255,255,.18); border:0; color:#fff; width:38px; height:38px; } .top .ibtn.live { background:var(--bad); }
  .demo { background:var(--warnbg); color:var(--warn); text-align:center; font-size:12px; font-weight:700; padding:4px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .body { flex:1; overflow-y:auto; padding:14px 12px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch;
    background-color:var(--bg); background-image:radial-gradient(color-mix(in srgb,var(--mute) 14%,transparent) 1.2px,transparent 1.2px); background-size:22px 22px; }
  .b { max-width:82%; padding:8px 12px 6px; border-radius:14px; box-shadow:0 1px 1px rgba(0,0,0,.1); word-wrap:break-word; position:relative; animation:in .18s ease-out; }
  @keyframes in { from { opacity:0; transform:translateY(6px); } }
  .b.them { align-self:flex-start; background:var(--surface); border-top-left-radius:4px; } .b.me { align-self:flex-end; background:var(--bubble-me); color:var(--bubble-ink); border-top-right-radius:4px; }
  .b small { display:flex; justify-content:flex-end; gap:3px; align-items:center; opacity:.6; font-size:11px; margin-top:2px; } .b small .ic { width:15px; height:15px; } .b.read small { color:#34b7f1; opacity:1; }
  .typing { align-self:flex-start; background:var(--surface); padding:12px 14px; border-radius:14px; display:flex; gap:4px; } .typing i { width:7px; height:7px; border-radius:50%; background:var(--mute); animation:bl 1.2s infinite; } .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; } @keyframes bl { 30% { transform:translateY(-4px); opacity:.5; } }
  .slots { align-self:flex-start; display:flex; flex-wrap:wrap; gap:8px; max-width:92%; } .slot { display:flex; align-items:center; gap:8px; padding:9px 13px; border-radius:14px; background:var(--surface); border:1.5px solid var(--wa); color:var(--wa); font-weight:650; } .slot:active { transform:scale(.97); }
  .sys { align-self:center; display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:14px; font-weight:650; font-size:14px; box-shadow:0 1px 2px rgba(0,0,0,.1); animation:in .2s; } .sys.ok { background:var(--okbg); color:var(--ok); } .sys.bad { background:var(--badbg); color:var(--bad); } .sys.warn { background:var(--warnbg); color:var(--warn); } .sys .ic { width:22px; height:22px; }
  .quick { display:flex; gap:8px; padding:8px 12px; overflow-x:auto; background:var(--bg); } .quick button { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:99px; border:1px solid var(--line); background:var(--surface); font-weight:600; white-space:nowrap; } .quick .ic { color:var(--wa); }
  .bar { display:flex; align-items:center; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:var(--bg); }
  .bar input { flex:1; min-width:0; padding:12px 16px; border-radius:99px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:16px; }
  .bar .ibtn { width:46px; height:46px; } .bar .send { background:var(--wa); color:#fff; border:0; }
  #join { position:fixed; inset:0; background:linear-gradient(160deg,#0b6b3a,#1fa855 55%,#14b8a6); display:flex; align-items:center; justify-content:center; padding:24px; z-index:20; }
  #join .card { width:100%; max-width:360px; padding:26px 22px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
  #join .big { width:76px; height:76px; border-radius:50%; background:var(--okbg); color:var(--wa); display:flex; align-items:center; justify-content:center; } #join .big .ic { width:38px; height:38px; }
  #join input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; text-align:center; }
  #join .btn { width:100%; justify-content:center; background:var(--wa); box-shadow:0 6px 16px rgba(31,168,85,.35); }
  .row2 { display:flex; gap:10px; color:var(--mute); } .row2 .ic { width:22px; height:22px; }
</style>
</head>
<body>
<div id="join"><div class="card">
  <div class="big"><span data-ic="shield"></span></div><h2 style="margin:0">Gatekeeper</h2>
  <div class="row2"><span data-ic="mic"></span><span data-ic="chat"></span><span data-ic="calendar"></span><span data-ic="shield"></span></div>
  <input type="password" id="tok" placeholder="Access token" autocomplete="off" aria-label="Access token">
  <button class="btn" id="start"><span data-ic="chat"></span> Start chat</button>
  <div class="chip" id="platform"></div>
</div></div>

<header class="top" id="top" hidden>
  <div class="avatar" id="av">·</div>
  <div class="who"><b id="ownerName">…</b><small><span class="dot" id="pdot"></span><span id="presence">connecting</span></small></div>
  <button class="ibtn" id="mic" aria-label="Microphone"><span data-ic="mic"></span></button>
  <button class="ibtn" id="end" aria-label="End"><span data-ic="x"></span></button>
</header>
<div class="demo" id="demoBar" hidden><span data-ic="flask"></span> demo: calendar reads are real, bookings are not written</div>
<div class="body" id="chat" hidden></div>
<div class="quick" id="quick" hidden>
  <button data-say="I'd like to book a meeting"><span data-ic="calendar"></span>Book</button>
  <button data-say="I'd like to leave a message"><span data-ic="mail"></span>Message</button>
  <button data-say="What times are free tomorrow?"><span data-ic="clock"></span>Free times</button>
</div>
<div class="bar" id="bar" hidden>
  <input type="text" id="txt" placeholder="Message" autocomplete="off" enterkeyhint="send" aria-label="Message">
  <button class="ibtn send" id="send" aria-label="Send"><span data-ic="send"></span></button>
</div>
<script src="/static/icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const UA = navigator.userAgent, ANDROID = /Android/.test(UA);
const IOS = !ANDROID && (/iP(hone|ad|od)/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));  // iPadOS reports as a Mac
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, TTS = "speechSynthesis" in window;
const q = new URLSearchParams(location.search);
const QUIET = q.get("quiet") === "1";                      // stage/demo: no speaker, no mic
let handsFree = !IOS, wantMic = !!SR && !QUIET, connected = false, listening = false, speaking = false, awaiting = false, ended = false;
let ws, rec, wakeLock, pingTimer, voice, lastMe, owner = "owner";
if (q.get("token")) { $("tok").value = q.get("token"); history.replaceState(null, "", location.pathname + (QUIET ? "?quiet=1" : "")); }
$("platform").textContent = QUIET ? "demo" : !SR ? "type only" : IOS ? "tap 🎤 to talk" : "hands-free voice";
const callerId = (() => { if (QUIET) return "stage-" + Math.random().toString(36).slice(2, 10); /* fresh caller each stage run */ try { return localStorage.gkid || (localStorage.gkid = "web-" + crypto.randomUUID()); } catch { return "web-" + Math.random().toString(36).slice(2); } })();
const ch = $("chat");
function add(node) { ch.append(node); ch.scrollTop = 1e9; return node; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
const esc = (t) => t.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const clock = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function bubble(text, who) { const b = el("div", "b " + who, `<div>${esc(text)}</div><small>${clock()}${who === "me" ? svgIcon("check") : ""}</small>`); add(b); if (who === "me") lastMe = b; return b; }
function typing(on) { const t = $("typing"); if (on && !t) { const d = el("div", "typing", "<i></i><i></i><i></i>"); d.id = "typing"; add(d); } else if (!on && t) t.remove(); }
function sys(cls, icon, text) { add(el("div", "sys " + cls, svgIcon(icon) + `<span>${esc(text)}</span>`)); }
function setPresence(txt, cls) { $("presence").textContent = txt; $("pdot").className = "dot " + (cls || ""); }
function renderMic() { $("mic").classList.toggle("live", listening); $("mic").hidden = !SR || QUIET; }

function pickVoice() { if (!TTS) return; const vs = speechSynthesis.getVoices(), lang = (navigator.language || "en-US").toLowerCase(); voice = vs.find((v) => v.lang.toLowerCase() === lang && v.localService) || vs.find((v) => v.lang.toLowerCase().startsWith(lang.slice(0, 2))) || null; }
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!TTS || QUIET) { afterSpeech(); return; }
  stopListening(); speaking = true;
  const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = voice ? voice.lang : (navigator.language || "en-US");
  let done = false; const finish = () => { if (done) return; done = true; clearTimeout(guard); speaking = false; afterSpeech(); };
  u.onend = u.onerror = finish; const guard = setTimeout(finish, 2500 + text.length * 90);  // onend never fires on some browsers
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function afterSpeech() { renderMic(); if (handsFree && wantMic) startListening(); }
function startListening() {
  if (!SR || QUIET || listening || speaking || awaiting || !connected) return;
  rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false;
  let gotFinal = false;
  rec.onresult = (e) => { const r = e.results[e.results.length - 1]; $("txt").placeholder = r.isFinal ? "Message" : "🎤 " + r[0].transcript; if (r.isFinal) { gotFinal = true; $("txt").placeholder = "Message"; send(r[0].transcript); } };
  rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") { wantMic = false; sys("warn", "alert", "Mic blocked. Allow it for this site, or type."); } else if (e.error === "network") sys("warn", "alert", "Speech needs internet."); };
  rec.onend = () => { listening = false; renderMic(); $("txt").placeholder = "Message"; if (handsFree && wantMic && !gotFinal && !speaking && !awaiting && connected && !document.hidden) setTimeout(startListening, 300); };
  try { rec.start(); listening = true; renderMic(); } catch { listening = false; }
}
function stopListening() { if (rec && listening) { try { rec.abort(); } catch {} } listening = false; renderMic(); }

function send(text) {
  text = (text || "").trim(); if (!text || !connected) return;
  bubble(text, "me"); awaiting = true; stopListening(); typing(true);
  ws.send(JSON.stringify({ type: "text", text }));
}
async function lockScreen() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => { if (document.hidden) { stopListening(); TTS && speechSynthesis.cancel(); speaking = false; } else if (connected) { lockScreen(); afterSpeech(); } });

function connect() {
  ended = false; awaiting = true;
  const proto = location.protocol === "https:" ? "wss" : "ws", tok = $("tok").value.trim();
  const url = `${proto}://${location.host}/ws/call/${encodeURIComponent(q.get("owner") || "owner")}?server_tts=0&caller_id=${encodeURIComponent(callerId)}` + (q.get("dryrun") === "1" ? "&dryrun=1" : "") + (tok ? `&token=${encodeURIComponent(tok)}` : "");
  $("join").hidden = true; ["top", "chat", "quick", "bar"].forEach((i) => ($(i).hidden = false)); renderMic(); typing(true);
  if (TTS && !QUIET) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }  // unlock audio inside the tap gesture (iOS)
  ws = new WebSocket(url);
  ws.onopen = () => { connected = true; lockScreen(); pingTimer = setInterval(() => { try { ws.send('{"type":"ping"}'); } catch {} }, 25000); };
  ws.onclose = (e) => {
    connected = false; awaiting = false; typing(false); clearInterval(pingTimer); stopListening(); try { wakeLock && wakeLock.release(); } catch {}
    setPresence(ended ? "call ended" : "disconnected", "");
    const msg = e.code === 4401 ? "Wrong token" : e.code === 4404 ? "Unknown owner" : e.code === 4429 ? "Too many chats, wait a minute" : ended ? "" : "Connection lost";
    if (msg) sys("bad", "alert", msg);
    if (e.code !== 4401 && e.code !== 4404) { const b = el("button", "btn", svgIcon("refresh") + "Chat again"); b.style.alignSelf = "center"; b.onclick = () => { b.remove(); connect(); }; add(b); }
  };
  ws.onmessage = (m) => {
    if (typeof m.data !== "string") return; const e = JSON.parse(m.data);
    if (e.type === "session_started") { owner = e.owner || owner; $("ownerName").textContent = owner; $("av").textContent = owner[0].toUpperCase(); setPresence(e.focus ? "in focus mode" : "unavailable", e.focus ? "focus" : ""); $("demoBar").hidden = !e.demo; }
    else if (e.type === "agent_text") { awaiting = false; typing(false); if (lastMe) { lastMe.classList.add("read"); const t = lastMe.querySelector("small .ic"); if (t) t.outerHTML = svgIcon("checks"); } bubble(e.text, "them"); speak(e.text); if (parent !== window) parent.postMessage({ gk: "reply", text: e.text }, location.origin); }
    else if (e.type === "slots_offered") { const d = el("div", "slots"); e.slots.forEach((s) => { const b = el("button", "slot", svgIcon("clock") + esc(s.when.replace(/^\w+ /, ""))); b.onclick = () => send("The " + s.when + " one, please"); d.append(b); }); add(d); }
    else if (e.type === "booking_confirmed") sys("ok", "calcheck", `Booked · ${e.when}${e.invite_sent ? " · invite sent" : ""}`);
    else if (e.type === "guard_flagged") sys("bad", "shieldx", "Blocked by the safety guard");
    else if (e.type === "error") { awaiting = false; typing(false); sys("warn", "alert", e.message || e.code); afterSpeech(); }
  };
}
$("start").onclick = connect;
$("send").onclick = () => { const t = $("txt").value; $("txt").value = ""; send(t); };
$("txt").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };
$("mic").onclick = () => { if (!SR) return; if (listening) { wantMic = false; stopListening(); } else { wantMic = true; startListening(); } };
$("end").onclick = () => { ended = true; wantMic = false; stopListening(); TTS && speechSynthesis.cancel(); try { ws.send('{"type":"hangup"}'); ws.close(); } catch {} };
document.querySelectorAll("[data-say]").forEach((b) => (b.onclick = () => send(b.dataset.say)));
window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.gk === "say") send(e.data.text); });
if (q.get("autostart") === "1" && $("tok").value) connect();
</script>
</body>
</html>
