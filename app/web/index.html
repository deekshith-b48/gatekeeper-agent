<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gatekeeper">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Gatekeeper</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15171a; --mute:#6b7280; --acc:#2563eb; --ok:#16a34a; --bad:#dc2626; --line:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1013; --card:#171a1f; --ink:#eceef1; --mute:#9aa3af; --line:#272b32; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,sans-serif; display:flex; flex-direction:column; height:100dvh; overscroll-behavior:none; }
  header { padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:17px; margin:0; flex:1; }
  #status { font-size:13px; color:var(--mute); max-width:55%; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; background:var(--card); border:1px solid var(--line); word-wrap:break-word; }
  .you { align-self:flex-end; background:var(--acc); color:#fff; border-color:var(--acc); }
  .note { align-self:center; font-size:13px; color:var(--mute); text-align:center; }
  .slots { align-self:flex-start; display:flex; flex-wrap:wrap; gap:8px; }
  .slot { border:1px solid var(--line); background:var(--card); padding:6px 12px; border-radius:999px; font-size:14px; }
  .booked { align-self:center; background:var(--ok); color:#fff; padding:10px 16px; border-radius:12px; font-weight:600; text-align:center; }
  .warn { align-self:center; color:var(--bad); font-size:13px; text-align:center; }
  footer { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  input[type=text], input[type=password] { flex:1; min-width:0; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:16px; }
  button { border:0; border-radius:12px; padding:12px 16px; font-size:16px; background:var(--acc); color:#fff; touch-action:manipulation; }
  button.sec { background:var(--card); color:var(--ink); border:1px solid var(--line); }
  button.live { background:var(--bad); color:#fff; border-color:var(--bad); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity:.65; } }
  #mic { min-width:52px; font-size:20px; padding:10px 14px; }
  #setup { padding:16px; display:flex; flex-direction:column; gap:10px; }
  #mode { background:none; border:1px solid var(--line); color:var(--mute); padding:4px 10px; font-size:12px; border-radius:999px; }
</style>
</head>
<body>
<header><h1>Gatekeeper</h1><button id="mode" hidden></button><span id="status">not connected</span></header>
<div id="setup">
  <div class="note" style="text-align:left">Leave a message or book time with the owner. Your browser does the speech recognition and speaking, so nothing is installed.</div>
  <input type="text" id="who" placeholder="Owner handle" value="owner" autocomplete="off" autocapitalize="off" autocorrect="off">
  <input type="password" id="tok" placeholder="Access token (if required)" autocomplete="off">
  <button id="start">Start call</button>
  <div class="note" id="platform"></div>
</div>
<div id="log" hidden></div>
<footer hidden id="bar">
  <button id="mic" class="sec" aria-label="Microphone">🎤</button>
  <input type="text" id="txt" placeholder="…or type here" autocomplete="off" enterkeyhint="send">
  <button id="send">Send</button>
  <button id="end" class="sec">End</button>
</footer>
<script>
const $ = (id) => document.getElementById(id);
const UA = navigator.userAgent;
const ANDROID = /Android/.test(UA);
const IOS = !ANDROID && (/iP(hone|ad|od)/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));  // iPadOS reports as a Mac
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const TTS = "speechSynthesis" in window;
const q = new URLSearchParams(location.search);
if (q.get("owner")) $("who").value = q.get("owner");
if (q.get("token")) { $("tok").value = q.get("token"); history.replaceState(null, "", location.pathname); }  // keep the token out of the address bar/history

// iOS Safari recognition stops unpredictably and can't loop hands-free: default to tap-to-talk there.
let handsFree = !IOS, wantMic = !!SR, connected = false, listening = false, speaking = false, awaiting = false, ended = false;
let ws, rec, wakeLock, pingTimer, voice;
$("platform").textContent = !SR ? "Voice input isn't supported in this browser (use Chrome, Edge or Safari). You can type instead."
  : IOS ? "iPhone/iPad: tap the mic each time you speak (most reliable on Safari)."
  : ANDROID ? "Android: hands-free. Just talk after the assistant finishes." : "Hands-free: just talk after the assistant finishes.";
const callerId = (() => { try { return localStorage.gkid || (localStorage.gkid = "web-" + crypto.randomUUID()); } catch { return "web-" + Math.random().toString(36).slice(2); } })();

function add(cls, text) { const d = document.createElement("div"); d.className = cls; d.textContent = text; $("log").appendChild(d); $("log").scrollTop = 1e9; return d; }
function setStatus(t) { $("status").textContent = t; }
function renderMode() { $("mode").hidden = !SR; $("mode").textContent = handsFree ? "hands-free" : "tap to talk"; $("mic").classList.toggle("live", listening); $("mic").textContent = listening ? "⏺" : "🎤"; }

function pickVoice() { if (!TTS) return; const vs = speechSynthesis.getVoices(); const lang = (navigator.language || "en-US").toLowerCase();
  voice = vs.find((v) => v.lang.toLowerCase() === lang && v.localService) || vs.find((v) => v.lang.toLowerCase().startsWith(lang.slice(0, 2))) || null; }
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

function speak(text) {
  if (!TTS) { afterSpeech(); return; }
  stopListening(); speaking = true;
  const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.lang = voice ? voice.lang : (navigator.language || "en-US");
  let done = false; const finish = () => { if (done) return; done = true; clearTimeout(guard); speaking = false; afterSpeech(); };
  u.onend = u.onerror = finish;
  const guard = setTimeout(finish, 2500 + text.length * 90);  // onend never fires on some browsers (long text, iOS, tab switches)
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function afterSpeech() { renderMode(); setStatus(connected ? (handsFree && wantMic ? "your turn" : "tap 🎤 to talk") : "call ended"); if (handsFree && wantMic) startListening(); }

function startListening() {
  if (!SR || listening || speaking || awaiting || !connected) return;
  rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  let gotFinal = false;
  rec.onresult = (e) => { const r = e.results[e.results.length - 1]; setStatus(r.isFinal ? "thinking…" : "🎤 " + r[0].transcript);
    if (r.isFinal) { gotFinal = true; send(r[0].transcript); } };
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") { wantMic = false; setStatus("type your message"); add("warn", "Microphone/speech recognition is blocked. Allow it for this site (iOS: Settings → Safari, and turn on Dictation), or type instead."); }
    else if (e.error === "network") add("warn", "Speech recognition needs an internet connection.");
  };
  rec.onend = () => { listening = false; renderMode(); if (handsFree && wantMic && !gotFinal && !speaking && !awaiting && connected && !document.hidden) setTimeout(startListening, 300); };
  try { rec.start(); listening = true; renderMode(); setStatus("listening…"); } catch { listening = false; }
}
function stopListening() { if (rec && listening) { try { rec.abort(); } catch {} } listening = false; renderMode(); }

function send(text) {
  text = (text || "").trim(); if (!text || !connected) return;
  awaiting = true; stopListening(); setStatus("thinking…");
  ws.send(JSON.stringify({ type: "text", text }));
}

async function lockScreen() { try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopListening(); speechSynthesis && speechSynthesis.cancel(); speaking = false; }
  else if (connected) { lockScreen(); afterSpeech(); }
});

function connect() {
  ended = false; awaiting = true;
  const proto = location.protocol === "https:" ? "wss" : "ws", tok = $("tok").value.trim();
  const url = `${proto}://${location.host}/ws/call/${encodeURIComponent($("who").value.trim() || "owner")}?server_tts=0&caller_id=${encodeURIComponent(callerId)}` + (tok ? `&token=${encodeURIComponent(tok)}` : "");
  $("setup").hidden = true; $("log").hidden = false; $("bar").hidden = false; setStatus("connecting…"); renderMode();
  if (TTS) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); }  // unlock audio inside the tap gesture (iOS)
  ws = new WebSocket(url);
  ws.onopen = () => { connected = true; setStatus("connected"); lockScreen(); pingTimer = setInterval(() => { try { ws.send('{"type":"ping"}'); } catch {} }, 25000); };
  ws.onclose = (e) => {
    connected = false; awaiting = false; clearInterval(pingTimer); stopListening(); try { wakeLock && wakeLock.release(); } catch {}
    const why = e.code === 4401 ? "Wrong access token." : e.code === 4404 ? "Unknown owner." : e.code === 4429 ? "Too many calls, wait a minute." : ended ? "" : "Connection lost.";
    setStatus(ended ? "call ended" : "disconnected");
    if (why) add("warn", why);
    if (e.code !== 4401 && e.code !== 4404) { const b = document.createElement("button"); b.textContent = "Call again"; b.onclick = () => { b.remove(); connect(); }; $("log").appendChild(b); }
  };
  ws.onmessage = (m) => {
    if (typeof m.data !== "string") return;
    const e = JSON.parse(m.data);
    if (e.type === "agent_text") { awaiting = false; add("msg", e.text); speak(e.text); }
    else if (e.type === "transcript_final") add("msg you", e.text);
    else if (e.type === "slots_offered") { const d = add("slots", ""); e.slots.forEach((s) => { const b = document.createElement("span"); b.className = "slot"; b.textContent = s.when; d.appendChild(b); }); }
    else if (e.type === "booking_confirmed") add("booked", `Booked: ${e.when}${e.invite_sent ? " · invite sent" : ""}`);
    else if (e.type === "guard_flagged") add("note", "That request can't be handled by this assistant.");
    else if (e.type === "error") { awaiting = false; add("warn", e.message || e.code); afterSpeech(); }
  };
}
$("start").onclick = connect;
$("send").onclick = () => { const t = $("txt").value; $("txt").value = ""; send(t); };
$("txt").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };
$("mic").onclick = () => {
  if (!SR) { add("note", "Voice input isn't supported here. Type instead."); return; }
  if (listening) { wantMic = false; stopListening(); setStatus("mic off"); } else { wantMic = true; startListening(); }
};
$("mode").onclick = () => { handsFree = !handsFree; wantMic = true; renderMode(); afterSpeech(); };
$("end").onclick = () => { ended = true; wantMic = false; stopListening(); TTS && speechSynthesis.cancel(); try { ws.send('{"type":"hangup"}'); ws.close(); } catch {} };
renderMode();
</script>
</body>
</html>
