<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/inbox.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Gatekeeper Inbox</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --ink:#0f172a; --mute:#64748b; --line:#e2e8f0; --acc:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --okbg:#dcfce7; --badbg:#fee2e2; --warnbg:#fef3c7; --chip:#eef2f7; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --card:#121933; --ink:#e8ecf8; --mute:#93a0c0; --line:#222c4d; --okbg:#0f2f22; --badbg:#3a1520; --warnbg:#3a2c0f; --chip:#1a2240; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; } [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; min-height:100dvh; padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:calc(12px + env(safe-area-inset-top)) 16px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:18px; flex:1; } .count { background:var(--acc); color:#fff; border-radius:99px; padding:2px 10px; font-size:13px; font-weight:700; }
  main { max-width:720px; margin:0 auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; }
  .focus { display:flex; align-items:center; gap:14px; } .focus .t { flex:1; } .focus b { font-size:17px; } .focus small { color:var(--mute); display:block; }
  .sw { width:64px; height:36px; border-radius:99px; background:var(--chip); border:1px solid var(--line); position:relative; flex:none; transition:.2s; padding:0; }
  .sw::after { content:""; position:absolute; top:3px; left:3px; width:28px; height:28px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:.2s; }
  .sw.on { background:var(--acc); border-color:var(--acc); } .sw.on::after { left:31px; }
  .tabs { display:flex; gap:8px; } .tab { flex:1; padding:10px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:600 14px inherit; font-family:inherit; }
  .tab.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  .item { display:flex; flex-direction:column; gap:8px; border-left:5px solid var(--acc); } .item.urgent { border-left-color:var(--bad); } .item.read { opacity:.62; border-left-color:var(--line); }
  .item .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .kind { font-weight:700; text-transform:capitalize; }
  .chip { font-size:12px; padding:2px 9px; border-radius:99px; background:var(--chip); color:var(--mute); } .chip.u { background:var(--badbg); color:var(--bad); font-weight:700; } .chip.b { background:var(--okbg); color:var(--ok); }
  #live { background:var(--okbg); color:var(--ok); font-weight:700; }
  .when { margin-left:auto; color:var(--mute); font-size:12.5px; } .sum { word-wrap:break-word; }
  .row { display:flex; gap:8px; flex-wrap:wrap; } .btn { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; font:600 14px inherit; font-family:inherit; text-decoration:none; }
  .btn.p { background:var(--acc); color:#fff; border-color:var(--acc); }
  .tr { background:var(--chip); border-radius:12px; padding:10px 12px; font-size:14px; display:flex; flex-direction:column; gap:6px; } .tr b { color:var(--mute); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .empty { text-align:center; color:var(--mute); padding:36px 10px; } .err { color:var(--bad); text-align:center; font-size:14px; }
  #gate { padding:20px; display:flex; flex-direction:column; gap:10px; max-width:420px; margin:40px auto; } input { font:inherit; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
</style>
</head>
<body>
<header><h1>Gatekeeper</h1><span class="chip" id="live" hidden>● live</span><span class="count" id="count" hidden></span><button class="btn" id="refresh" aria-label="Refresh">↻</button></header>
<div id="gate" class="card" hidden><b>Owner access</b><small style="color:var(--mute)">Enter your admin token once on this phone.</small><input type="password" id="tokIn" placeholder="Admin token" autocomplete="off"><button class="btn p" id="tokGo">Open inbox</button><div class="err" id="tokErr"></div></div>
<main id="app" hidden>
  <div class="card focus"><div class="t"><b id="fTitle">Focus mode</b><small id="fSub"></small></div><button class="sw" id="fSw" aria-label="Toggle focus mode"></button></div>
  <div class="tabs"><button class="tab on" id="tUnread">Unread</button><button class="tab" id="tAll">All</button><button class="btn" id="readAll">Mark all read</button></div>
  <div id="list"></div><div class="err" id="err"></div>
</main>
<script>
const $ = (id) => document.getElementById(id), h = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const q = new URLSearchParams(location.search);
if (q.get("admin")) { try { localStorage.gkadmin = q.get("admin"); } catch {} history.replaceState(null, "", location.pathname); }
let TOKEN = ""; try { TOKEN = localStorage.gkadmin || ""; } catch {}
let tab = "unread", data = null, timer;
async function api(path, method = "GET") {
  const r = await fetch(path, { method, headers: { "x-admin-token": TOKEN } });
  if (r.status === 401 || r.status === 403) { $("app").hidden = true; $("gate").hidden = false; throw new Error("auth"); }
  if (!r.ok) throw new Error(r.statusText); return r.json();
}
const ago = (iso) => { const s = (Date.now() - Date.parse(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : new Date(iso).toLocaleDateString(); };
const ICON = { booking: "📅", message: "✉️", "calendar down": "⚠️", "agent down": "⚠️" };
async function load() {
  try { data = await api("/api/inbox"); $("gate").hidden = true; $("app").hidden = false; $("err").textContent = ""; render(); }
  catch (e) { if (e.message !== "auth") $("err").textContent = "Can't reach the server. Is it running?"; }
}
function render() {
  const f = data.focus; $("fSw").classList.toggle("on", f.on);
  $("fTitle").textContent = f.on ? "Focus mode is ON" : "Focus mode is off";
  $("fSub").textContent = f.on ? `Gatekeeper is screening calls${f.since ? " since " + new Date(f.since).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : ""}. Routine alerts wait here.` : "Alerts reach your phone immediately.";
  const unread = data.items.filter((i) => !i.read).length; $("count").hidden = !unread; $("count").textContent = unread; document.title = unread ? `(${unread}) Gatekeeper Inbox` : "Gatekeeper Inbox";
  $("tUnread").classList.toggle("on", tab === "unread"); $("tAll").classList.toggle("on", tab === "all");
  const L = $("list"); L.replaceChildren(); const items = data.items.filter((i) => tab === "all" || !i.read);
  if (!items.length) L.append(h("div", "empty", tab === "unread" ? "Nothing new. You're all caught up." : "No messages yet."));
  items.forEach((i) => {
    const c = h("div", "card item" + (i.urgent ? " urgent" : "") + (i.read ? " read" : "")), top = h("div", "top");
    top.append(h("span", "kind", `${ICON[i.kind] || "•"} ${i.kind}`)); if (i.channel) top.append(h("span", "chip", { whatsapp: "💬 WhatsApp", voice: "🎤 voice", web: "🌐 web", email: "✉ email" }[i.channel] || i.channel)); if (i.urgent) top.append(h("span", "chip u", "URGENT")); if (i.caller.times_contacted > 1) top.append(h("span", "chip", `${i.caller.times_contacted}× caller`)); if (!i.delivered) top.append(h("span", "chip", "not pushed")); top.append(h("span", "when", ago(i.created)));
    c.append(top, h("div", "sum", i.summary));
    const row = h("div", "row"), phone = /^\+?[0-9][0-9 ()-]{6,}$/.test(i.caller.contact) ? i.caller.contact : "";
    if (phone) { const a = h("a", "btn p", "📞 Call back"); a.href = "tel:" + phone.replace(/[^0-9+]/g, ""); row.append(a); }
    if (phone) { const a = h("a", "btn", "💬 WhatsApp"); a.href = "https://wa.me/" + phone.replace(/[^0-9]/g, ""); a.target = "_blank"; a.rel = "noopener"; row.append(a); }
    if (i.caller.email) { const a = h("a", "btn", "✉ Email"); a.href = "mailto:" + i.caller.email; row.append(a); }
    const tx = h("div", "tr"); tx.hidden = true; i.transcript.forEach((m) => { const d = h("div"); d.append(h("b", "", m.role === "agent" ? "Gatekeeper" : "Caller"), h("div", "", m.text)); tx.append(d); });
    if (i.transcript.length) { const b = h("button", "btn", "Conversation"); b.onclick = () => (tx.hidden = !tx.hidden); row.append(b); }
    if (!i.read) { const b = h("button", "btn", "Mark read"); b.onclick = async () => { await api(`/api/inbox/${i.id}/read`, "POST"); load(); }; row.append(b); }
    c.append(row, tx); L.append(c);
  });
}
$("fSw").onclick = async () => { $("fSw").disabled = true; try { await fetch("/api/focus", { method: "POST", headers: { "x-admin-token": TOKEN, "content-type": "application/json" }, body: JSON.stringify({ on: !data.focus.on }) }); } finally { $("fSw").disabled = false; load(); } };
$("tUnread").onclick = () => { tab = "unread"; render(); }; $("tAll").onclick = () => { tab = "all"; render(); };
$("readAll").onclick = async () => { await api("/api/inbox/read", "POST"); load(); }; $("refresh").onclick = load;
$("tokGo").onclick = async () => { TOKEN = $("tokIn").value.trim(); try { localStorage.gkadmin = TOKEN; } catch {} $("tokErr").textContent = ""; try { await api("/api/focus"); load(); } catch { $("tokErr").textContent = "Wrong token."; } };
document.addEventListener("visibilitychange", () => { if (!document.hidden && TOKEN) load(); });
function live() {
  if (!TOKEN || !window.EventSource) return;
  const es = new EventSource("/api/stream?key=" + encodeURIComponent(TOKEN));
  es.onopen = () => ($("live").hidden = false); es.onerror = () => ($("live").hidden = true);
  es.onmessage = (m) => { const e = JSON.parse(m.data); if (["alert", "focus", "turn"].includes(e.type)) load(); if (e.type === "alert" && "vibrate" in navigator && !document.hidden) navigator.vibrate(120); };
}
if (TOKEN) { load(); live(); timer = setInterval(() => !document.hidden && load(), 20000); } else $("gate").hidden = false;
</script>
</body>
</html>
