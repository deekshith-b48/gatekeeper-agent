<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090d1f">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/ui.css">
<title>Gatekeeper · Showcase</title>
<style>
  body { background:radial-gradient(1100px 520px at 50% -8%,color-mix(in srgb,var(--brand) 20%,transparent),transparent),var(--bg); }
  nav { position:sticky; top:0; z-index:10; background:color-mix(in srgb,var(--surface) 86%,transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .bar { max-width:1180px; margin:0 auto; padding:9px 18px; display:flex; align-items:center; gap:8px; } .logo { width:32px; height:32px; border-radius:11px; background:linear-gradient(135deg,var(--brand),var(--brand2)); display:flex; align-items:center; justify-content:center; color:#fff; margin-right:6px; }
  .bar .ibtn { width:38px; height:38px; border:0; background:transparent; } .bar .ibtn:hover { background:var(--surface2); } .grow { flex:1; }
  main { max-width:1180px; margin:0 auto; padding:0 18px 70px; } section { margin-top:34px; scroll-margin-top:70px; } h2 { font-size:15px; margin:0 0 12px; display:flex; align-items:center; gap:10px; color:var(--mute); text-transform:uppercase; letter-spacing:.09em; }
  .hero { padding:38px 0 8px; text-align:center; } .hero h1 { font-size:clamp(28px,5vw,48px); letter-spacing:-.03em; line-height:1.05; margin:0 0 18px; } .hero h1 span { background:linear-gradient(90deg,var(--brand),var(--brand2),#ec4899); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .cta { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:22px; } .cta .btn { padding:13px 20px; }
  .flow { display:flex; align-items:center; justify-content:center; gap:0; flex-wrap:wrap; margin-top:20px; } .node { display:flex; flex-direction:column; align-items:center; gap:8px; width:96px; text-align:center; } .node .b { width:60px; height:60px; border-radius:20px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--brand); box-shadow:var(--shadow); transition:.25s; } .node small { color:var(--mute); font-size:12px; font-weight:600; }
  .node.on .b { background:var(--brand); color:#fff; transform:translateY(-4px); box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 25%,transparent); } .node.done .b { color:var(--ok); border-color:var(--ok); } .node.block .b { color:var(--bad); border-color:var(--bad); background:var(--badbg); } .node.skip { opacity:.35; }
  .link { width:26px; height:2px; background:linear-gradient(90deg,var(--line),var(--brand2),var(--line)); background-size:200% 100%; animation:flow 2s linear infinite; margin-bottom:26px; } @keyframes flow { to { background-position:-200% 0; } }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:14px; max-width:760px; margin:26px auto 0; } .side { padding:16px; display:flex; flex-direction:column; align-items:center; gap:10px; } .side .row { display:flex; gap:12px; color:var(--brand); } .side b { font-size:13px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; }
  .ucs { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:12px; } .uc { padding:14px 8px; display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; cursor:default; }
  .ring { --p:0; --c:var(--mute); width:68px; height:68px; border-radius:50%; background:conic-gradient(var(--c) calc(var(--p) * 1%), var(--surface2) 0); display:flex; align-items:center; justify-content:center; } .ring > span { width:54px; height:54px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--c); }
  .uc small { font-size:12.5px; font-weight:650; } .uc em { font-style:normal; font-size:11px; color:var(--mute); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:12px; margin-bottom:12px; } .kpi { padding:14px 16px; display:flex; align-items:center; gap:12px; } .kpi .ki { width:44px; height:44px; border-radius:14px; background:var(--surface2); display:flex; align-items:center; justify-content:center; color:var(--brand); flex:none; } .kpi .v { font-size:26px; font-weight:800; line-height:1; letter-spacing:-.02em; } .kpi.ok .v, .kpi.ok .ki { color:var(--ok); } .kpi.bad .v, .kpi.bad .ki { color:var(--bad); }
  .meter { height:10px; background:var(--surface2); border-radius:99px; overflow:hidden; display:flex; margin:4px 0 14px; } .meter i { display:block; height:100%; transition:width .5s; }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .pill { font-size:12px; padding:5px 11px; border-radius:99px; background:var(--surface2); color:var(--mute); display:inline-flex; align-items:center; gap:6px; } .pill.ok { background:var(--okbg); color:var(--ok); } .pill.bad { background:var(--badbg); color:var(--bad); }
  .tests { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); } .grp > summary { cursor:pointer; padding:10px 14px; background:var(--surface2); font-weight:700; display:flex; align-items:center; gap:10px; list-style:none; } .grp > summary::-webkit-details-marker { display:none; } .grp .c { margin-left:auto; color:var(--mute); font-size:13px; font-weight:500; }
  .t { display:flex; gap:10px; align-items:center; padding:7px 14px; border-top:1px solid var(--line); } .t .nm { flex:1; word-break:break-all; font-family:ui-monospace,Menlo,monospace; font-size:12.5px; } .t .ms { color:var(--mute); font-size:12px; } .td { width:9px; height:9px; border-radius:50%; flex:none; } .td.passed { background:var(--ok); } .td.failed { background:var(--bad); } .td.skipped { background:var(--mute); opacity:.5; }
  input, select, textarea { font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; } textarea { width:100%; min-height:80px; resize:vertical; }
  .lab { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.25fr); gap:14px; } @media (max-width:860px) { .lab, .sides { grid-template-columns:1fr; } }
  .tl { display:flex; flex-direction:column; gap:8px; } .ev { display:flex; gap:10px; border-radius:12px; padding:10px 12px; background:var(--surface2); border-left:4px solid var(--mute); } .ev.g { border-left-color:var(--ok); } .ev.r { border-left-color:var(--bad); background:var(--badbg); } .ev.b { border-left-color:var(--brand); } .ev .ic { margin-top:2px; } .ev .tx { min-width:0; flex:1; } .ev b { font-size:13px; } .ev code, .tx2 { font-size:12px; color:var(--mute); word-break:break-all; display:block; }
  .score { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-top:14px; } .grid { display:grid; gap:14px; } .g3 { grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); }
  .bars { display:flex; flex-direction:column; gap:10px; } .bar2 { display:grid; grid-template-columns:24px 1fr 88px; gap:10px; align-items:center; font-size:13px; } .bar2 .tr { height:10px; background:var(--surface2); border-radius:99px; overflow:hidden; } .bar2 .tr i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); }
  table { width:100%; border-collapse:collapse; font-size:13.5px; } th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; } .tx2 b { color:var(--ink); }
  #gate { position:fixed; inset:0; background:rgba(5,8,22,.78); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; } #gate .card { max-width:340px; width:100%; padding:26px; display:flex; flex-direction:column; align-items:center; gap:12px; } #gate input { width:100%; text-align:center; }
  .note { color:var(--mute); font-size:13px; } .err { color:var(--bad); font-size:13px; }
</style>
</head>
<body>
<nav><div class="bar">
  <span class="logo" data-ic="shield"></span>
  <a class="ibtn" href="#top" title="Overview"><span data-ic="layers"></span></a><a class="ibtn" href="#usecases" title="Use cases"><span data-ic="star"></span></a><a class="ibtn" href="#testsec" title="Tests"><span data-ic="flask"></span></a><a class="ibtn" href="#lab" title="Red-team lab"><span data-ic="target"></span></a><a class="ibtn" href="#data" title="Live data"><span data-ic="chart"></span></a>
  <span class="grow"></span><span class="pill" id="pLLM" title="LLM"><span data-ic="bot"></span>…</span><span class="pill" id="pCal" title="Calendar"><span data-ic="calendar"></span>…</span><span class="pill" id="pTests" title="Tests"><span data-ic="flask"></span>—</span>
</div></nav>
<div id="gate" hidden><div class="card"><span data-ic="lock" data-cls="xl"></span><input type="password" id="tokIn" placeholder="Admin token" autocomplete="off" aria-label="Admin token"><button class="btn" id="tokGo"><span data-ic="check"></span> Open</button><div class="err" id="tokErr"></div></div></div>

<main id="top">
<div class="hero">
  <h1>Your calendar's <span>bouncer</span></h1>
  <div class="flow" id="flow"></div>
  <div class="sides">
    <div class="card side"><b>Caller</b><div class="row"><span data-ic="mic" data-cls="lg"></span><span data-ic="chat" data-cls="lg"></span><span data-ic="wa" data-cls="lg"></span></div><span class="chip ok"><span data-ic="calcheck"></span>books a slot</span></div>
    <div class="card side"><b>You, in focus</b><div class="row"><span data-ic="moon" data-cls="lg"></span><span data-ic="bell" data-cls="lg"></span><span data-ic="inbox" data-cls="lg"></span></div><span class="chip"><span data-ic="eye"></span>sees it after</span></div>
  </div>
  <div class="cta"><a class="btn" href="/stage"><span data-ic="play"></span> Live stage</a><a class="btn sec" href="/" target="_blank"><span data-ic="chat"></span> Chat</a><a class="btn sec" href="/inbox" target="_blank"><span data-ic="inbox"></span> Inbox</a><button class="btn sec" id="heroRun"><span data-ic="flask"></span> Run tests</button></div>
</div>

<section id="usecases"><h2><span data-ic="star"></span></h2><div class="ucs" id="ucs"></div></section>

<section id="testsec"><h2><span data-ic="flask"></span></h2>
  <div class="card" style="padding:16px">
    <div class="row" style="margin-bottom:14px"><button class="btn" id="runFast"><span data-ic="play"></span> Run</button><button class="btn sec" id="runLive" title="Includes 28 attacks against the real LLM"><span data-ic="zap"></span> Run + live LLM</button><span class="note" id="runNote"></span><span class="grow"></span><input id="q" placeholder="Filter" style="width:140px" aria-label="Filter tests"><select id="flt" aria-label="Status"><option value="all">All</option><option value="passed">Passed</option><option value="failed">Failed</option><option value="skipped">Skipped</option></select></div>
    <div class="kpis" id="kpis"></div><div class="meter" id="meter"></div><div class="tests" id="tests"><div class="t note">—</div></div>
  </div></section>

<section id="lab"><h2><span data-ic="target"></span></h2>
  <div class="lab">
    <div class="card" style="padding:16px"><select id="atk" style="width:100%;margin-bottom:10px" aria-label="Scenario"></select><textarea id="atkText" placeholder="Say something a caller (or attacker) might say…" aria-label="Message"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="atkGo"><span data-ic="send"></span> Send</button><span class="note" id="atkNote"></span></div><div class="score" id="score" hidden></div></div>
    <div class="card" style="padding:16px"><div class="tl" id="trace"><div class="note"><span data-ic="shield" data-cls="xl"></span></div></div></div>
  </div></section>

<section id="data"><h2><span data-ic="chart"></span></h2>
  <div class="kpis" id="dkpis"></div>
  <div class="grid g3" style="margin-bottom:14px"><div class="card" style="padding:16px;grid-column:span 2"><div class="row"><span data-ic="zap"></span><span class="pill" id="liveDot">…</span></div><div class="tl" id="feed" style="margin-top:10px;max-height:300px;overflow:auto"></div></div>
    <div class="card" id="waCard" hidden style="padding:16px;text-align:center"><span data-ic="wa" data-cls="xl"></span><img id="waQr" alt="WhatsApp QR" style="width:170px;height:170px;margin:10px auto;display:block;background:#fff;padding:6px;border-radius:12px"></div></div>
  <div class="grid g3"><div class="card" style="padding:16px"><div class="bars" id="bars"></div></div>
    <div class="card" style="padding:16px;grid-column:span 2;overflow:auto"><table><tbody id="convs"></tbody></table></div></div></section>
</main>

<script src="/static/icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const q = new URLSearchParams(location.search);
if (q.get("admin")) { sessionStorage.gkadmin = q.get("admin"); try { localStorage.gkadmin = q.get("admin"); } catch {} history.replaceState(null, "", location.pathname); }
let TOKEN = sessionStorage.gkadmin || (() => { try { return localStorage.gkadmin || ""; } catch { return ""; } })(), ALL = null;
async function api(path, opts = {}) {
  const r = await fetch("/api/showcase" + path, { ...opts, headers: { "x-admin-token": TOKEN, "content-type": "application/json" } });
  if (r.status === 401 || r.status === 403) { $("gate").hidden = false; throw new Error("auth"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText); return r.json();
}
$("tokGo").onclick = async () => { TOKEN = $("tokIn").value.trim(); sessionStorage.gkadmin = TOKEN; try { localStorage.gkadmin = TOKEN; } catch {} $("tokErr").textContent = ""; try { await api("/attacks"); $("gate").hidden = true; boot(); } catch { $("tokErr").textContent = "✗"; } };
const UC = { book: ["calcheck", "Book"], slots: ["clock", "Real slots"], double: ["lock", "No double-book"], inject: ["shieldx", "Attacks"], outage: ["alert", "Outages"], input: ["tool", "Bad input"], urgent: ["zap", "Urgent"], wa: ["wa", "WhatsApp"], focus: ["moon", "Focus"], live: ["bot", "Live LLM"] };
const FLOW = [["phone", "Caller"], ["shield", "Guard"], ["bot", "Planner"], ["lock", "Tools"], ["calendar", "Calendar"], ["bell", "Alert"]];
function renderFlow(state = {}) { const f = $("flow"); f.replaceChildren(); FLOW.forEach(([ic, t], i) => { if (i) f.append(h("div", "link")); const n = h("div", "node " + (state[i] || "")), b = h("div", "b"); b.append(iconEl(ic, "lg")); n.append(b, h("small", "", t)); f.append(n); }); }

function renderUC(list) { const g = $("ucs"); g.replaceChildren(); list.forEach((u) => { const [ic, name] = UC[u.id] || ["star", u.title], c = h("div", "card uc"), r = h("div", "ring"), pct = u.tests ? Math.round(u.passed / u.tests * 100) : 0;
  r.style.setProperty("--p", u.status === "not_run" ? 0 : pct); r.style.setProperty("--c", u.status === "failed" ? "var(--bad)" : u.status === "passed" ? "var(--ok)" : "var(--mute)"); const inner = h("span"); inner.append(iconEl(ic, "lg")); r.append(inner);
  c.title = u.title + ": " + u.description; c.append(r, h("small", "", name), h("em", "", u.tests ? `${u.passed}/${u.tests}` : "—")); g.append(c); }); }

function kpi(label, val, cls = "", icon = "chart") { const k = h("div", "card kpi " + cls), i = h("div", "ki"); i.append(iconEl(icon)); const d = h("div"); d.append(h("div", "v", String(val))); k.title = label; k.append(i, d); return k; }
function renderTests(d) {
  ALL = d; const s = d.summary; renderUC(d.use_cases); if (!s) return;
  $("kpis").replaceChildren(kpi("Passed", s.passed, "ok", "check"), kpi("Failed", s.failed, s.failed ? "bad" : "", "x"), kpi("Skipped", s.skipped, "", "clock"), kpi("Total", s.total, "", "list"), kpi("Seconds", (s.duration_ms / 1000).toFixed(1), "", "zap"));
  const m = $("meter"); m.replaceChildren(); [["passed", "var(--ok)"], ["failed", "var(--bad)"], ["skipped", "var(--mute)"]].forEach(([k, c]) => { const i = h("i"); i.style.width = (s[k] / s.total * 100) + "%"; i.style.background = c; m.append(i); });
  const p = $("pTests"); p.replaceChildren(iconEl("flask"), document.createTextNode(s.failed ? `${s.failed} failing` : `${s.passed}/${s.passed + s.failed}`)); p.className = "pill " + (s.failed ? "bad" : "ok");
  $("runNote").textContent = `${d.finished_at} · ${d.wall_s}s${d.live ? " · live LLM" : ""}`; drawTests();
}
function drawTests() {
  if (!ALL || !ALL.tests.length) return; const f = $("flt").value, term = $("q").value.toLowerCase(), box = $("tests"); box.replaceChildren();
  const groups = {}; ALL.tests.forEach((t) => { if ((f === "all" || t.outcome === f) && (t.id + t.category).toLowerCase().includes(term)) (groups[t.category] ||= []).push(t); });
  Object.entries(groups).forEach(([cat, ts]) => { const d = h("details", "grp"); d.open = ts.some((t) => t.outcome === "failed") || Object.keys(groups).length <= 2;
    const sum = h("summary"), ok = ts.filter((t) => t.outcome === "passed").length, bad = ts.filter((t) => t.outcome === "failed").length;
    sum.append(iconEl(bad ? "x" : ok ? "check" : "clock"), h("span", "", cat), h("span", "c", `${ok}/${ts.length}${ts.length - ok - bad ? ` · ${ts.length - ok - bad} skipped` : ""}`)); sum.style.color = bad ? "var(--bad)" : ok ? "var(--ok)" : "var(--mute)"; d.append(sum);
    ts.forEach((t) => { const r = h("div", "t"); r.append(h("span", "td " + t.outcome), h("span", "nm", t.name), h("span", "ms", t.outcome === "skipped" ? "skipped" : t.duration_ms + " ms")); if (t.message) r.title = t.message; d.append(r); }); box.append(d); });
  if (!box.children.length) box.append(h("div", "t note", "—"));
}
$("flt").onchange = $("q").oninput = drawTests;
async function runTests(live) {
  [$("runFast"), $("runLive"), $("heroRun")].forEach((b) => (b.disabled = true)); const t0 = Date.now(), btn = live ? $("runLive") : $("runFast"), orig = btn.innerHTML;
  btn.innerHTML = '<span class="spin" style="border-color:var(--brand);border-top-color:transparent"></span>'; const tick = setInterval(() => ($("runNote").textContent = ((Date.now() - t0) / 1000).toFixed(0) + "s"), 500);
  try { renderTests(await api("/tests", { method: "POST", body: JSON.stringify({ live }) })); } catch (e) { $("runNote").textContent = e.message; }
  clearInterval(tick); btn.innerHTML = orig; hydrateIcons(btn); [$("runFast"), $("runLive"), $("heroRun")].forEach((b) => (b.disabled = false)); loadStats();
}
$("runFast").onclick = () => runTests(false); $("runLive").onclick = () => runTests(true); $("heroRun").onclick = () => { location.hash = "#testsec"; runTests(false); };

function ev(cls, icon, title, ...nodes) { const e = h("div", "ev " + cls), t = h("div", "tx"); e.append(iconEl(icon)); t.append(h("b", "", title), ...nodes); e.append(t); return e; }
async function attack() {
  const text = $("atkText").value; if (!text.trim() && !confirm("Send an empty message?")) return;
  $("atkGo").disabled = true; $("atkNote").textContent = "…"; $("trace").replaceChildren(h("div", "note", "…")); $("score").hidden = true;
  let i = 0; renderFlow({ 0: "on" }); const anim = setInterval(() => { i = Math.min(i + 1, 4); const st = {}; for (let k = 0; k < i; k++) st[k] = "done"; st[i] = "on"; renderFlow(st); }, 900);
  try {
    const r = await api("/attack", { method: "POST", body: JSON.stringify({ text }) }); clearInterval(anim);
    const used = r.trace.some((t) => t.name !== "input_guard"), st = { 0: "done", 1: r.guard.flagged ? "block" : "done", 2: "done", 3: used ? "done" : "skip", 4: r.trace.some((t) => ["get_free_slots", "book_meeting"].includes(t.name)) ? "done" : "skip", 5: r.trace.some((t) => t.name === "book_meeting" || t.name === "take_message") ? "done" : "skip" }; if (r.guard.flagged) { st[3] = st[4] = st[5] = "skip"; } renderFlow(st);
    const T = $("trace"); T.replaceChildren(); T.append(ev("b", "user", "Caller", h("code", "", text.length > 200 ? text.slice(0, 200) + "…" : text || "(empty)")));
    const g = ev(r.guard.flagged ? "r" : "g", r.guard.flagged ? "shieldx" : "shield", r.guard.flagged ? "Blocked" : "Guard passed"); r.guard.reasons.forEach((x) => g.querySelector(".tx").append(h("span", "chip bad", x))); T.append(g);
    r.trace.filter((t) => t.name !== "input_guard").forEach((t) => T.append(ev(t.error === "denied" ? "r" : "b", t.error === "denied" ? "x" : "tool", t.name + (t.error === "denied" ? " · denied" : ""), h("span", "tx2", t.args || "{}"), h("span", "tx2", (t.result || "").slice(0, 240)))));
    T.append(ev("g", "bot", "Reply", h("div", "", `“${r.reply}”`), h("span", "tx2", `${r.wall_ms} ms`))); r.events.forEach((e) => T.append(ev("b", "zap", e.type, h("span", "tx2", JSON.stringify(e).slice(0, 240)))));
    const S = $("score"); S.replaceChildren(kpi("Owner tools executed", r.scorecard.foreign_tools_executed, r.scorecard.foreign_tools_executed ? "bad" : "ok", "shield"), kpi("Denied", r.scorecard.foreign_tools_denied, "", "lock"), kpi("Real events", 0, "ok", "calendar"), kpi("Dry-run writes", r.scorecard.dry_run_writes.length, "", "flask")); S.hidden = false; $("atkNote").textContent = "";
  } catch (e) { clearInterval(anim); $("trace").replaceChildren(h("div", "err", e.message)); $("atkNote").textContent = ""; }
  $("atkGo").disabled = false;
}
$("atkGo").onclick = attack; $("atk").onchange = () => ($("atkText").value = $("atk").selectedOptions[0].dataset.text || "");

const CH = { whatsapp: "wa", voice: "mic", web: "globe", email: "mail" };
function renderStats(s) {
  $("pLLM").replaceChildren(iconEl("bot"), document.createTextNode(s.system.model.split("/").pop() + (s.system.second_provider ? " +1" : ""))); $("pCal").replaceChildren(iconEl("calendar"), document.createTextNode(s.system.calendar.split(" ")[0]));
  $("dkpis").replaceChildren(kpi("Conversations", s.conversations, "", "chat"), kpi("Callers", s.callers, "", "users"), kpi("Bookings", s.bookings, "ok", "calcheck"), kpi("Tool calls", s.tool_calls, "", "tool"), kpi("Attacks blocked", s.guard_blocks, s.guard_blocks ? "ok" : "", "shieldx"), kpi("Denied by role", s.tools_denied, "", "lock"));
